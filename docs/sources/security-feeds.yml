      NOT the same site as The Hacker News below.

  - name: The Hacker News
    url: https://thehackernews.com
    rss: https://feeds.feedburner.com/TheHackersNews
    category: aggregator
    tier: watch
    focus: broad security news firehose; skim for breaking items (distinct from Hacker News above)

  - name: BleepingComputer
    url: https://www.bleepingcomputer.com
    rss: https://www.bleepingcomputer.com/feed/
    category: aggregator
    tier: watch
    focus: breaking malware/ransomware and vuln news
