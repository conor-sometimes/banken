title: Download from an IP literal into a temp dir
id: 0a128f0b-b920-46e1-bf78-ff3e4f63cddc
status: experimental
description: >
  A program ran curl/wget against a bare IP address (not a hostname) writing into /tmp, /dev/shm or
  /var/tmp. Fetching a payload by IP into a scratch dir is a classic first stage: it skips DNS and
  any name allow-list, and legitimate automation almost always fetches from a named host. The
  attempt is the signal whether or not the fetch succeeds.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
logsource:
  product: linux
  category: process_creation
detection:
  fetch:
    Image|endswith:
      - /curl
      - /wget
  # Fable: curl/wget accept non-dotted-decimal IPs (decimal, hex, octal, IPv6)
  # that skip DNS like a dotted IP but evaded the dotted-quad-only regex.
  ip_literal:
    CommandLine|re: 'https?://(\[[0-9a-fA-F:]+\]|0x[0-9a-fA-F]+|[0-9]{8,10}|(\d{1,3}\.){3}\d{1,3}|0\d+\.)'
  to_scratch:
    CommandLine|contains:
      - /tmp/
      - /dev/shm/
      - /var/tmp/
      - ' -o '
      - ' -O'
  condition: fetch and ip_literal and to_scratch
falsepositives:
  - Health checks or metadata fetches to 169.254.169.254 (cloud metadata) - exclude that IP if used.
level: high
