title: Reverse shell spawned
id: 0c9b10de-25ea-4ad5-8e07-d33508386857
status: experimental
description: >
  A program invoked a classic reverse-shell one-liner - bash's /dev/tcp, a Python/Perl/Ruby socket
  shell, or nc with an exec. Opening an interactive shell back to a remote host is almost never
  legitimate automation; the attempt is unambiguous whether or not the outbound connection
  succeeds.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
logsource:
  product: linux
  category: process_creation
tags:
  - attack.command-and-control
  - attack.t1059.004
detection:
  bash_devtcp:
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
  # the one-liner's syntax, not bare words: a long argv of file names (py_compile over the
  # stdlib lists socket.py, multiprocessing/connection.py, subprocess.py) must not match
  python_socket:
    CommandLine|contains|all:
      - 'socket.socket('
      - '.connect('
    CommandLine|contains:
      - 'subprocess.'
      - 'pty.spawn('
      - 'os.dup2('
  # Fable: '\bnc\b' can't match 'ncat'; cover nc and ncat, -e/-c/--exec/--sh-exec
  nc_exec:
    CommandLine|re: '\bn(c|cat)\b.*(-e\b|-c\b|--exec|--sh-exec)'
  # socat EXEC/SYSTEM: very common, was entirely unmatched (Fable)
  socat_exec:
    Image|endswith: /socat
    CommandLine|re: '\b(EXEC|SYSTEM):'
  # mkfifo + nc without -e (no -e flag, so nc_exec misses it) (Fable)
  mkfifo_nc:
    CommandLine|contains|all:
      - mkfifo
      - '|nc '
  perl_ruby:
    CommandLine|contains:
      - "exec(\"/bin/sh"
      - 'IO::Socket::INET'
      - 'TCPSocket.open'
      - 'TCPSocket.new'   # Fable: ruby .new, not just .open
      - 'fsockopen('      # Fable: php
  condition: bash_devtcp or python_socket or nc_exec or socat_exec or mkfifo_nc or perl_ruby
falsepositives:
  - Rare; a legitimate network-probe or health-check script using /dev/tcp. Review it.
  - "(fixed 2026-10-24) an apt postinstall byte-compiling Python's stdlib in a container; its argv
    named socket.py, connection.py and subprocess.py. Now matched on syntax, not words."
level: critical
