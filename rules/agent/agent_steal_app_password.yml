title: AI agent account reading an application-specific password store
id: 8da38252-3de5-4e35-944e-e77c35ac0c6a
status: experimental
description: >
  An AI agent account read a store that holds an application-specific password (ASP) - a mail client's
  saved credentials (.msmtprc, .mbsyncrc/.isyncrc, .offlineimaprc, .muttrc/.neomuttrc, .fetchmailrc,
  Thunderbird's logins.json), an Emacs/Gnus .authinfo(.gpg), a .netrc/_netrc machine entry, or a
  git-credentials store. This is the host-observable slice of MITRE T1697 Steal Application Specific
  Passwords (new in ATT&CK v20): ASPs are secondary passwords a user generates to let a legacy app or
  non-interactive tool into an account, and because they sidestep interactive MFA, a stolen ASP lets an
  attacker reuse the account while bypassing MFA.

  Be honest about scope: T1697 is mostly an identity-provider / SaaS technique - generating an ASP at
  the IdP, phishing a user for one, then logging in over a legacy non-MFA path - and that is invisible
  to a host EDR (it lives in IdP/SaaS audit logs, which is what the technique's own analytics key on).
  What banken CAN see is the one host-adjacent variant the technique lists, "obtain an ASP stored on a
  system": the agent reading an on-host ASP store. That is what this rule catches, scoped by account so
  it is clean signal from an agent that has no business reading another identity's mail credentials.

  credential_file_read owns the host-wide SSH-key / shadow / cloud-secret reads (and overlaps on
  .netrc and .git-credentials); this is the account-scoped, application-specific-password framing and
  adds the mail-client / .authinfo stores that the host-wide rule does not carry. This is an
  "agentic AI detection" rule. See rules/agent/README.md.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
  - https://attack.mitre.org/techniques/T1697/
author: banken
date: 2026-11-02
logsource:
  product: linux
  category: process_creation
tags:
  - attack.credential-access
  - attack.t1697
detection:
  agent_user:
    User:
      - claude
      - redteam
      - lab
  # A known reader with the ASP store's path on its command line.
  reader:
    Image|endswith:
      - /cat
      - /less
      - /more
      - /head
      - /tail
      - /xxd
      - /od
      - /strings
      - /base64
  asp_path:
    CommandLine|re: '(\.msmtprc|\.mbsyncrc|\.isyncrc|\.offlineimaprc|\.fetchmailrc|\.neomuttrc|\.muttrc|\.mailrc|\.authinfo(\.gpg)?|\.netrc|/_netrc|\.git-credentials|/thunderbird/[^ ]*(logins\.json|signons\.sqlite))\b'
  # Binary-agnostic: ANY process whose file access (auditd PATH) touched an ASP store,
  # which catches readers the command-line form misses (an editor, an interpreter, cp/dd).
  asp_file:
    TargetFilename|re: '(\.msmtprc|\.mbsyncrc|\.isyncrc|\.offlineimaprc|\.fetchmailrc|\.neomuttrc|\.muttrc|\.mailrc|\.authinfo(\.gpg)?|\.netrc|/_netrc|\.git-credentials|/thunderbird/[^/]*/(logins\.json|signons\.sqlite))$'
  condition: agent_user and ((reader and asp_path) or asp_file)
falsepositives:
  - An agent whose own task set up a mail/IMAP client and re-reads its own config. Reading another
    identity's ASP store from an agent account is anomalous by design; scope the agent_user list to
    your accounts, or exclude the task's own config path.
level: high
