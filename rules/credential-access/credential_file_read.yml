title: Credential file read by a spawned program
id: 2eaef911-26d1-4c33-b627-1380cdcdcdad
status: experimental
description: >
  A program read a credential directly: private SSH keys, the shadow file, a git credential store,
  cloud or token files. Either a known reader (cat/less/base64/...) with the path on its command
  line, OR -- binary-agnostic -- any process whose file access (auditd PATH) touched one of these
  paths, which catches readers the command-line form misses (dd, cp, an interpreter, an editor).
  Routine accessors (passwd, sshd, PAM) are allow-listed.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
modified: 2026-10-31
logsource:
  product: linux
  category: process_creation
detection:
  reader:
    Image|endswith:
      - /cat
      - /less
      - /more
      - /head
      - /tail
      - /xxd
      - /od
      - /strings
      - /base64
  secret_path:
    CommandLine|contains:
      - /.ssh/id_
      - id_ed25519
      - id_rsa
      - /etc/shadow
      - .git-credentials
      - /.config/gh/hosts.yml
      - /.aws/credentials
      - .netrc
      - /.gnupg/
  secret_file:   # binary-agnostic: ANY process whose file access touched a credential path
    TargetFilename|contains:
      - /.ssh/id_
      - id_ed25519
      - id_rsa
      - /etc/shadow
      - .git-credentials
      - /.config/gh/hosts.yml
      - /.aws/credentials
      - .netrc
      - /.gnupg/
  legit:   # routine accessors of the shadow file / PAM, allow-listed to curb noise
    Image|endswith:
      - /passwd
      - /chpasswd
      - /chage
      - /unix_chkpwd
      - /unix_update
      - /sshd
      - /systemd
      - /login
  condition: ((reader and secret_path) or secret_file) and not legit
falsepositives:
  - A user or tool legitimately managing its OWN ~/.ssh (authorized_keys); scope the watch to others' paths.
level: high
