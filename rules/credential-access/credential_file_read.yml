title: Credential file read by a spawned program
id: 2eaef911-26d1-4c33-b627-1380cdcdcdad
status: experimental
description: >
  A program read a credential directly: private SSH keys, the shadow file, a git credential store,
  cloud or token files. Either a known reader (cat/less/base64/...) with the path on its command
  line, OR -- binary-agnostic -- any process whose file access (auditd PATH) touched one of these
  paths, which catches readers the command-line form misses (dd, cp, an interpreter, an editor).
  Routine accessors (passwd, sshd, PAM) are allow-listed.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
modified: 2026-10-31
logsource:
  product: linux
  category: process_creation
tags:
  - attack.credential-access
  - attack.t1552.001
detection:
  reader:
    Image|endswith:
      - /cat
      - /less
      - /more
      - /head
      - /tail
      - /xxd
      - /od
      - /strings
      - /base64
  secret_path:
    CommandLine|contains:
      - /.ssh/id_
      - id_ed25519
      - id_rsa
      - /etc/shadow
      - /etc/gshadow
      - .git-credentials
      - /.config/gh/hosts.yml
      - /.aws/credentials
      - .docker/config.json
      - .netrc
      - /.gnupg/
      - /run/secrets/
      - /var/run/secrets/
      - /etc/ssl/private/
      - /etc/krb5.keytab
  secret_file:   # binary-agnostic: ANY process whose file access touched a credential path
    TargetFilename|contains:
      - /.ssh/id_
      - id_ed25519
      - id_rsa
      - /etc/shadow
      - /etc/gshadow
      - .git-credentials
      - /.config/gh/hosts.yml
      - /.aws/credentials
      - .docker/config.json
      - .netrc
      - /.gnupg/
      - /run/secrets/
      - /var/run/secrets/
      - /etc/ssl/private/
      - /etc/krb5.keytab
  # Routine accessors, allow-listed to curb noise -- anchored to real system
  # locations (incl. NixOS /nix/store/*/bin) so a renamed scratch/home copy
  # like /tmp/sshd cannot spoof the allow-list (Fable purple-team finding), and
  # it is applied only to the reader/cmdline branch's noise, never used to blind
  # the binary-agnostic file-access branch beyond these exact system binaries.
  legit:
    # Account management writes the shadow files by design (useradd and friends, from the
    # distro's shadow-utils): an admin adding a user is not credential theft. Creating an
    # account is its own technique (T1136) and belongs in its own rule. Found by the live
    # distro matrix's normal-day check (B2) on Rocky 9.
    Image|re: '^(/nix/store/[^/]+|/usr|/usr/local)?/s?bin/(passwd|chpasswd|chage|unix_chkpwd|unix_update|sshd|login|useradd|userdel|usermod|groupadd|groupdel|groupmod|gpasswd|newusers|chsh|chfn|vipw|vigr|pwck|grpck|pwconv|pwunconv|grpconv|grpunconv)$'
  # systemd itself, and its user database workers, which read the shadow files to answer
  # account lookups (systemd-userwork; found by the live distro matrix on Arch, B2).
  legit_systemd:
    Image|re: '^(/nix/store/[^/]+|/usr/lib|/lib)/systemd/systemd(-userwork|-userdbd)?$'
  condition: ((reader and secret_path) or secret_file) and not legit and not legit_systemd
falsepositives:
  - A user or tool legitimately managing its OWN ~/.ssh (authorized_keys); scope the watch to others' paths.
level: high
