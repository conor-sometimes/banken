title: Credential file search
id: 083c7a2a-a065-4f5c-989b-1ee922d220f3
status: experimental
description: >
  A process searched the filesystem for credentials - find by a credential filename or path, or a
  recursive grep for password/secret/token material across the disk. Reading one known credential
  file is credential_file_read; this is the hunt that comes before it, the discovery step
  (MITRE T1552.001) a freshly-landed account runs to learn which files are worth reading. banken's
  own ATT&CK range found this gap: 21 of 21 T1552.001 atomics walked past the read-only rule.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: banken
date: 2026-10-31
logsource:
  product: linux
  category: process_creation
tags:
  - attack.credential-access
  - attack.t1552.001
detection:
  # find / -name '.aws/credentials', find -path '*/.ssh/id_*', find -name .git-credentials ...
  find_cmd:
    Image|endswith: /find
  find_creds:
    CommandLine|contains:
      - .aws/credentials
      - .ssh/id_
      - id_rsa
      - id_ed25519
      - .git-credentials
      - .npmrc
      - .netrc
      - .pgpass
      - .my.cnf
      - .docker/config.json
      - .vault-token
      - .kube/config
      - .azure/
      - .config/gcloud
      - credentials.db
      - .gnupg
      - msal_token_cache
      - .oci/sessions
      - terraform.tfstate
      - terraform.tfvars
      - .pgpass
      - .my.cnf
      - .mongorc.js
      - .travis.yml
      - .gitlab-ci.yml
      - .drone.yml
      - Jenkinsfile
  # grep -ri password / , grep -R secret /home: a broad (recursive) hunt for a secret keyword.
  # A non-recursive grep of one named file is ordinary and stays out.
  grep_cmd:
    Image|endswith:
      - /grep
      - /egrep
      - /fgrep
  grep_recursive:
    CommandLine|re: '(^|\s)-[a-zA-Z]*[rR]'
  # rg (ripgrep) and ag (silver searcher) recurse the tree by default, so no -r flag to key on:
  # a secret keyword alone is the hunt.
  rg_cmd:
    Image|endswith:
      - /rg
      - /ag
  grep_secret:
    CommandLine|re: '\b(password|passwd|secret|api[_-]?key|access[_-]?key|secret[_-]?key|aws_secret|private[_-]?key|BEGIN (RSA|OPENSSH|EC|DSA|PGP))\b'
  condition: (find_cmd and find_creds) or (grep_cmd and grep_recursive and grep_secret) or (rg_cmd and grep_secret)
falsepositives:
  - A backup or config-management job that greps config trees for a setting; scope it to the users
    that have no business hunting credentials, as with the other credential rules.
level: medium
