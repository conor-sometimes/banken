title: Browser credential or profile store accessed
id: 7e2b9c04-1d58-4f36-8a90-3c6e0b7d2f85
status: experimental
description: >
  A program read a web-browser credential or profile store - Firefox's logins.json / key4.db /
  cookies.sqlite, Chrome/Chromium's "Login Data" / Cookies / Web Data, or a browser profile
  directory - or ran a known browser-secret dumper (LaZagne). Browsers keep saved passwords,
  cookies and tokens in these files; reading them harvests credentials and live sessions
  (MITRE T1555.003), and the same files are what bookmark/history discovery enumerates
  (MITRE T1217). A browser reading its own store runs as the browser binary, not cat/cp/sqlite3/find
  over the path, which is what this matches.
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: banken
date: 2026-11-01
logsource:
  product: linux
  category: process_creation
tags:
  - attack.credential-access
  - attack.t1555.003
  - attack.t1217
detection:
  reader:
    Image|endswith:
      - /cat
      - /cp
      - /mv
      - /sqlite3
      - /strings
      - /base64
      - /xxd
      - /python3
      - /python
      - /find
  browser_store:
    CommandLine|contains:
      - key4.db
      - key3.db
      - cert9.db
      - logins.json
      - signons.sqlite
      - cookies.sqlite
      - places.sqlite
      - formhistory.sqlite
      - '/Login Data'
      - '/Web Data'
      - '/Local Storage/leveldb'
      - .mozilla/firefox
      - .config/google-chrome
      - .config/chromium
      - .config/BraveSoftware
      - lazagne
      - laZagne
  condition: reader and browser_store
falsepositives:
  - A backup job that archives a user profile; it would not single out the credential files by name.
    Scope to the accounts that have no business reading a browser store.
level: high
