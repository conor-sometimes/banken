title: Downloaded or decoded content piped into a shell
id: e577da0b-3ddb-4f47-9ebd-132e09b65019
status: experimental
description: >
  A program piped the output of a download or a base64/xxd decode straight into a shell or
  interpreter - curl ... | bash, echo <b64> | base64 -d | sh, wget -qO- | python. This is remote
  or obfuscated code execution in one line and is almost never legitimate automation.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
logsource:
  product: linux
  category: process_creation
tags:
  - attack.execution
  - attack.t1059.004
detection:
  source:
    CommandLine|contains:
      - 'curl '
      - 'wget '
      - 'base64 -d'
      - 'base64 --decode'
      - 'xxd -r'
  # Fable: the old '(ba)?sh\b' can't match dash/zsh/ksh (no boundary mid-word),
  # omitted php/node/lua/awk, and only matched a literal '|' (missed <(...) and
  # $(...), the same remote-exec-in-one-line pattern).
  # Backport (banken-rules pilot): the shell set '(ba|da|z|k|a|c|tc|fi)?sh'
  # adds ash (Alpine /bin/sh), csh, tcsh and fish (Conor's login shell) to
  # bash/dash/zsh/ksh/sh. The trailing \b keeps every alternative a whole token,
  # so 'c'+'sh'=csh matches but 'cash' / 'bashful' do not (the prefix letters
  # only combine into a real shell name right at the pipe / <( / $( boundary).
  into_interpreter:
    CommandLine|re: '(\||<\(|\$\()\s*(sudo\s+)?(ba|da|z|k|a|c|tc|fi)?sh\b|(\||<\(|\$\()\s*(python[23]?|perl|ruby|php|node|lua|awk)\b'
  # a shell consuming a process substitution of the download, or eval of it
  evalsubst:
    CommandLine|re: '\beval\b|\b(ba|da|z|k|a|c|tc|fi)?sh\b\s+<\(|\bsource\b\s+<\(|\.\s+<\('
  condition: source and (into_interpreter or evalsubst)
falsepositives:
  - Some installers legitimately use curl | sh; treat these as review-worthy anyway.
level: high
