title: Command execution via interpreter one-liner (GTFOBin)
id: 99f4c2e7-31c3-4dfc-a2bd-0395f30d406b
status: experimental
description: >
  An interpreter was given an inline one-liner that runs a system command or spawns a shell -
  python -c 'import pty; pty.spawn("/bin/sh")' or 'os.system(...)', perl -e 'exec "/bin/sh"', awk
  'BEGIN{system(...)}', ruby -e 'system("/bin/sh")'. This is the GTFOBins command/shell move for
  scripting languages (MITRE T1059 / T1202 Indirect Command Execution), scoped to the inline -c/-e
  form so a real script file (opaque, just a filename) is not guessed at. The socket/connect
  reverse-shell idioms are deliberately excluded - reverse_shell.yml owns those - so this is the
  non-network command-exec case.
references:
  - https://gtfobins.github.io/
  - https://attack.mitre.org/techniques/T1059/
  - https://attack.mitre.org/techniques/T1202/
author: banken
date: 2026-11-02
logsource:
  product: linux
  category: process_creation
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.006
  - attack.t1202
detection:
  interp:
    Image|endswith:
      - /awk
      - /gawk
      - /mawk
      - /nawk
      - /perl
      - /python
      - /python2
      - /python3
      - /ruby
      - /lua
      - /php
  # the versioned binary the unversioned name resolves to (python3 -> .../bin/python3.12 on NixOS,
  # python2.7, ruby3.3, php8.3) - found by the live attack range, where the pty.spawn atomic
  # went unmatched because the exe was python3.12
  interp_versioned:
    Image|re: '/(python|perl|ruby|lua|php)[0-9]+(\.[0-9]+)*$'
  # an inline program, not a script file
  inline:
    CommandLine|re: '(^|\s)-(e|c)\b'
  # a command-exec / shell-spawn idiom (a path or shell after the call keeps it high-signal)
  exec_idiom:
    CommandLine|re: '(BEGIN\s*\{\s*system|os\.system\(|pty\.spawn\(|\bsystem\(["'']?/|\bexec\(["'']?/|\bexec\s+["'']?/bin/|IO\.popen|Open3\.|commands\.getoutput|Kernel\.(system|exec))'
  # socket/connect reverse shells belong to reverse_shell.yml - do not double-own them
  not_revshell:
    CommandLine|contains:
      - 'socket.socket('
      - '.connect('
      - 'IO::Socket::INET'
      - 'TCPSocket'
      - 'fsockopen('
      - '/dev/tcp/'
  condition: (interp or interp_versioned) and inline and exec_idiom and not not_revshell
falsepositives:
  - A legitimate data-processing one-liner that shells out (an awk BEGIN{system()} or a python -c
    os.system in a build). Scope by account where possible; the command line shows the payload.
level: medium
