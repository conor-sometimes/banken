title: Password cracking or brute-force tool
id: e141a822-5774-4081-9497-30848c9a4dc5
status: experimental
optional: true
description: >
  An offline password cracker (john, hashcat) or an online brute-force tool (hydra, medusa, ncrack,
  patator) ran. On a security team's own box these are the job and fire constantly; on any other host
  they are a strong sign of a credential attack (MITRE T1110) - cracking a captured hash, or
  hammering a service login. That split is why the rule is optional: enable it where these tools
  should never run, leave it off on the pentest or CTF workstation that lives in them.
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/002/
author: banken
date: 2026-11-01
logsource:
  product: linux
  category: process_creation
tags:
  - attack.credential-access
  - attack.t1110
  - attack.t1110.002
detection:
  tool:
    Image|endswith:
      - /john
      - /hashcat
      - /hydra
      - /medusa
      - /ncrack
      - /patator
  condition: tool
falsepositives:
  - A security team, pentest, or CTF host where these tools are expected to run; that is the reason
    the rule is optional rather than part of the shipped-on baseline.
level: medium
