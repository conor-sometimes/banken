title: Mandatory access control disabled
id: 6f0a4c83-2e97-4b15-8d3a-7c1e9b5f2a88
status: experimental
description: >
  A program turned off SELinux or AppArmor - setenforce 0 / Permissive, an aa-disable / aa-teardown /
  aa-complain, a systemctl stop/disable of apparmor, or an edit of /etc/selinux/config to
  SELINUX=disabled. The mandatory-access-control layer is what confines a service to what it is
  allowed to touch, so switching it off removes a containment boundary before acting (MITRE
  T1562.001). disable_logging and disable_firewall cover the logging and network defenses; this
  covers the MAC layer.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: banken
date: 2026-11-01
logsource:
  product: linux
  category: process_creation
tags:
  - attack.defense-evasion
  - attack.t1562.001
detection:
  setenforce:
    Image|endswith: /setenforce
    CommandLine|re: '(?i)(^|\s)0(\s|$)|permissive'
  apparmor_tool:
    Image|endswith:
      - /aa-disable
      - /aa-teardown
      - /aa-complain
  apparmor_systemctl:
    Image|endswith: /systemctl
    CommandLine|re: '\b(stop|disable|mask)\b.*\bapparmor\b'
  selinux_conf:
    CommandLine|contains:
      - SELINUX=disabled
      - /etc/selinux/config
  condition: setenforce or apparmor_tool or apparmor_systemctl or selinux_conf
falsepositives:
  - An admin toggling enforcement during troubleshooting; the command line shows it, and on a host
    that runs with MAC enforced, disabling it is deliberate and worth acknowledging.
level: high
