title: File timestamp modified (timestomp)
id: 84099f9c-35a5-4d0a-be64-80b20cbfb647
status: experimental
description: >
  A file's timestamp was set by hand - touch with an explicit time (-t / -d / --date) or copied from
  another file (-r / --reference). Backdating a dropped file so it blends with its neighbours, or
  matching it to a system binary's time, is anti-forensics (MITRE T1070.006): it defeats a
  timeline built on mtime/atime. A plain `touch` that just creates a file or bumps it to now is not
  matched.
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: banken
date: 2026-11-01
logsource:
  product: linux
  category: process_creation
tags:
  - attack.defense-evasion
  - attack.t1070.006
detection:
  touch:
    Image|endswith: /touch
  stomping:
    CommandLine|re: '(^|\s)-[a-zA-Z]*[tr]\b|--date\b|--reference\b|--time\b'
  condition: touch and stomping
falsepositives:
  - A build that sets reproducible timestamps (touch -d @0, touch -r) runs under the build user, not
    an interactive or agent account; scope by account if a build legitimately does this.
level: medium
