title: Encoded payload decoded and piped to a shell
id: f2a0c5a1-8683-4a3a-b551-770491f8b7d5
status: experimental
description: >
  Encoded data was decoded and fed straight into a shell - a decoder (base64 -d, base32 -d, xxd -r,
  uudecode, openssl ... -d) piped into sh/bash/zsh/dash, or wrapped in eval / a $(...) substitution.
  This is the deobfuscate-and-run pattern (MITRE T1140 into T1059): the next stage is carried as
  base64/hex so it slips past anything reading the command line, then decoded and executed in one
  breath. It is rarely anything but malicious - a human or a script with a real payload runs the file,
  it does not pipe a decode into a shell - so this fires host-wide, whoever runs it. agent_decode
  catches an agent account merely decoding (a softer, account-scoped signal); this is the run.
references:
  - https://attack.mitre.org/techniques/T1140/
  - https://attack.mitre.org/techniques/T1059/004/
author: banken
date: 2026-11-01
logsource:
  product: linux
  category: process_creation
tags:
  - attack.defense-evasion
  - attack.t1140
  - attack.execution
  - attack.t1059.004
detection:
  decode_to_shell:
    CommandLine|re: '(base64\s+(-d|--decode)|base32\s+(-d|--decode)|xxd\s+-r|uudecode|openssl\s+(base64|enc)[^|]*\s-d)\s*\|\s*(/\S+/)?(ba|da|z|k|a)?sh\b'
  decode_in_eval:
    CommandLine|re: '(eval\s|\$\()[^)]*\b(base64\s+(-d|--decode)|base32\s+-d|xxd\s+-r|uudecode)'
  condition: decode_to_shell or decode_in_eval
falsepositives:
  - A packaging or installer script that genuinely unpacks a base64 blob and runs it; rare, and the
    decoded command is right there on the line to judge.
level: high
