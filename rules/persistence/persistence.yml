title: Persistence established
id: 27872ea4-de7d-486f-8813-02ca2926a255
status: experimental
description: >
  A program tried to persist across sessions - installing a crontab, writing a systemd user unit or
  timer, or editing a shell rc / profile / ssh rc. Arranging to run again later, outside of a
  package manager or a config-management run, is how a compromised process survives a reboot.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-13
logsource:
  product: linux
  category: process_creation
detection:
  crontab:
    Image|endswith: /crontab
    # a crontab WRITE (crontab - / crontab <file> / -r / -u), not a read (-l) or
    # interactive edit (-e). RE2 has no lookahead, so enumerate the write forms.
    # Fable found the old ' -' wrongly matched 'crontab -l'.
    CommandLine|re: 'crontab\s+(-[ru]\b|-(\s|$)|[^-\s])'
  systemd_user_unit:
    CommandLine|contains:
      - '/.config/systemd/user/'
      - 'systemctl --user enable'
  shell_rc:
    Image|endswith:
      - /tee
      - /cp
      - /mv
      - /install
    CommandLine|contains:
      - '/.bashrc'
      - '/.bash_profile'
      - '/.profile'
      - '/.zshrc'
      - '/.ssh/rc'
      - '/.config/fish/'
      - '/.config/autostart/'
  # Fable gaps: system-wide persistence that doesn't go through the above.
  system_cron:
    TargetFilename|contains:
      - /etc/cron.d/
      - /etc/cron.daily/
      - /etc/cron.hourly/
      - /etc/cron.weekly/
      - /etc/cron.monthly/
      - /etc/crontab
      - /var/spool/cron/
  system_unit:
    CommandLine|contains:
      - /etc/systemd/system/
      - /run/systemd/system/
      - 'systemctl enable'
      - 'systemctl --system enable'
  authorized_keys:
    CommandLine|contains:
      - /.ssh/authorized_keys
  at_job:
    Image|endswith:
      - /at
      - /batch
  condition: crontab or systemd_user_unit or shell_rc or system_cron or system_unit or authorized_keys or at_job
falsepositives:
  - A user or tool legitimately managing its own long-running job via a user unit; confirm against the host's expected activity.
level: high
