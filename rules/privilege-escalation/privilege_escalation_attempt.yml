title: Privilege-escalation attempt
id: 66c956f8-8c2b-4e7e-98c1-f68a49419ead
status: experimental
description: >
  A program ran sudo, su, doas, pkexec or run0. On a host where a given account has no business
  escalating, the attempt itself is the signal: either something went wrong in a way worth reading,
  or a process is probing for a way up. Scope this to the users that should never escalate; for
  those that legitimately do, the command line shows what they ran.
references:
  - https://github.com/conor-sometimes/nixos-agent-containment
author: nixos-agent-containment
date: 2026-10-16
logsource:
  product: linux
  category: process_creation
detection:
  escalate:
    Image|endswith:
      - /sudo
      - /su
      - /doas
      - /pkexec
      - /run0
  condition: escalate
falsepositives:
  - A tool that probes for sudo before falling back (some installers run 'sudo -n true'); the
    command line shows it.
level: high
