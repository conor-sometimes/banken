version: "2"

# Mirrors the pth project's config: staticcheck/errcheck/govet/unused/gosec
# run standalone (see the justfile), so this is scoped to the linters that
# add signal beyond those, not a re-run of the same checks. gosec in
# particular is run standalone, never here -- golangci-lint's bundled gosec
# silently truncates a repo-wide scan via its own max-issues caps, which
# reads as a clean result when it is not (confirmed in pth). `just gosec`
# uses the standalone binary instead.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nakedret
    - perfsprint
    - predeclared
    - prealloc
    - tagliatelle
    - unconvert
    - whitespace
  settings:
    tagliatelle:
      case:
        rules:
          # banken's JSON tag convention is camelCase throughout, matching
          # the NixOS module's option names (urlFile, retentionDays,
          # commandLine, targetFilename, currentDirectory, ...). tagliatelle
          # defaults to camelCase if unconfigured, but set it explicitly so
          # the convention is documented and enforced, not incidental.
          json: camel
  exclusions:
    rules:
      # OCSF attribute names are snake_case by specification (class_uid,
      # finding_info, cmd_line, ...). The OCSF mapper is the one file whose
      # JSON tags spell someone else's schema, so it alone is exempt from the
      # camelCase rule above.
      - path: internal/alert/ocsf\.go$
        linters:
          - tagliatelle
      # ECS (Elastic Common Schema) field names are snake_case by
      # specification (command_line, working_directory, ...), exactly as OCSF
      # above. The ECS mapper spells Elastic's schema, so it is exempt from the
      # camelCase rule for the same reason.
      - path: internal/alert/ecs\.go$
        linters:
          - tagliatelle
      # The threat-intel parsers spell the STIX 2.1, TAXII 2.1 and MISP wire
      # formats, whose JSON keys are snake_case (pattern_type, to_ids) and
      # PascalCase (Event, Attribute, Object) by their own specifications. Like
      # the OCSF and ECS mappers above, these files decode someone else's
      # schema, so they are exempt from banken's camelCase tag convention.
      - path: internal/intel/(stix|misp|taxii)\.go$
        linters:
          - tagliatelle
