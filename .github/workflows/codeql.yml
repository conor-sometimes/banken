# CodeQL: GitHub's semantic/data-flow static analysis, on top of the pattern
# scanners (gosec, staticcheck). It follows tainted values through the program,
# which is the right tool for a parser of untrusted log bytes -- an injection
# or traversal that a pattern scanner misses shows up here. Findings land in the
# repository's Security tab (code scanning). On push/PR to main, and weekly so a
# query-pack update re-checks unchanged code.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the code-scanning results
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: go
          queries: security-extended # the deeper security query pack, not just the default

      - name: Build
        uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3

      - name: Analyze
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
