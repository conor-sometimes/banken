# OpenSSF Scorecard: an automated 0-10 grade of the repo's security practices
# (signed releases, pinned dependencies and actions, branch protection, SAST,
# fuzzing, dangerous-workflow checks, ...). banken already does most of what it
# measures; this publishes the score and a badge.
#
# Like CodeQL, the results upload is free on public repos and needs GitHub
# Advanced Security on private ones, and publishing to scorecard.dev requires a
# public repo -- so this job skips while banken is private and activates
# automatically when it goes public. Prep for release: it is correct and ready,
# just dormant until then.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the result to scorecard.dev
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true # list on scorecard.dev and enable the README badge

      # Keep the raw result as an artifact too, so it is downloadable from the run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: scorecard.sarif
