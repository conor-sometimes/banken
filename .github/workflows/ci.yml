name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  default:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Pinned, not @latest: an upstream tool release shipping a new lint
      # rule or vuln-DB check must never fail CI on a PR with no code
      # changes of its own. Bump these deliberately, in their own commit,
      # checked against a clean `just default` first.
      - name: Install lint/test tooling
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install github.com/kisielk/errcheck@v1.30.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install gotest.tools/gotestsum@v1.13.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: just default
        run: just default

      # Per-commit checklist guards (docs/dev/checklist.md, Tier 1). All cheap,
      # all one `just` recipe each so a contributor runs the same thing locally
      # (`just precommit` runs these plus `just default` and ocsf-validate).
      - name: Own rules all load
        run: just rules-check

      - name: Cross-compile guard (windows/amd64, no cgo)
        run: just cross-compile

      - name: Binary-size guard
        run: just size-check

      # The NixOS module's VM test (tests/vm.nix, `nix flake check`) needs
      # KVM and runs on the build host, not here.

  # Validates every OCSF finding golden against the pinned OCSF schema with
  # the OCSF project's own validator (see `just ocsf-validate` for the pins).
  # A separate job: it fetches the schema and two pinned tools, none of which
  # touch go.mod or the binary.
  ocsf:
    needs: default
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install uv
        run: pipx install uv

      - name: just ocsf-validate
        run: just ocsf-validate

  # Performance is tracked, not vibed: every push runs the benchmarks and
  # prints benchstat's delta from the committed baseline into the run summary,
  # and keeps the raw numbers as an artifact. It does NOT fail on a regression
  # -- shared CI runners are too noisy for a hard gate -- so a real regression
  # is read from the delta and the trend, and the baseline is re-committed
  # deliberately (`just bench-baseline`) when a change is meant to move it.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Run benchmarks
        run: |
          mkdir -p bench
          go test ./... -run '^$' -bench . -benchmem -count=6 | tee bench/new.txt
      - name: Compare to baseline
        run: |
          echo '### Benchmarks vs committed baseline (indicative: baseline may be from another machine)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f bench/baseline.txt ]; then
            benchstat bench/baseline.txt bench/new.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'no bench/baseline.txt committed yet' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # The longitudinal log: append this commit's median numbers (one JSON line,
      # see bench/cmd/benchhist) to bench/history.ndjson and keep the result as an
      # artifact. Not committed from CI (the repo is not written to by Actions);
      # `just bench-history` appends a line measured on a trusted machine.
      - name: Append to benchmark history
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          CGO_ENABLED=0 go build -ldflags '-s -w' -trimpath -o output/banken .
          go run ./bench/cmd/benchhist -commit "$COMMIT" -date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -binary-bytes "$(wc -c < output/banken | tr -d ' ')" < bench/new.txt | tee -a bench/history.ndjson
          {
            echo '### This commit in the benchmark history (bench/history.ndjson)'
            echo '```json'
            tail -n 1 bench/history.ndjson
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmarks
          path: |
            bench/new.txt
            bench/history.ndjson

  # A CycloneDX SBOM of the binary on every push (downloadable artifact); a
  # release attaches it. Works regardless of repo visibility.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Generate SBOM
        run: just sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: output/banken.cdx.json
